# This workflow runs application tests.
name: 01 - Run application tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Test the application
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Setup TestLens
      uses: testlens-app/setup-testlens@v1

    - name: Run Tests
      run: ./gradlew -Pcodegenome.project.token=$CODEGENOME_TOKEN :app:test
      env:
        CODEGENOME_TOKEN: ${{ secrets.CODEGENOME_TOKEN }}
